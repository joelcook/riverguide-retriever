[package]
name = "riverguide-lab"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_yaml = "0.9"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
